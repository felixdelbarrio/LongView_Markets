[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "longview-markets-backend"
version = "0.1.0"
description = "FastAPI backend for LongView Markets"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "polars>=1.18",
  "pyarrow>=18.0",
  "duckdb>=1.1",
  "sqlmodel>=0.0.22",
  "SQLAlchemy>=2.0",
  "APScheduler>=3.10",
  "typer>=0.15",
  "PyYAML>=6.0",
  "pywebview>=5.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.8",
  "black>=24.10",
  "mypy>=1.14",
  "bandit>=1.8",
  "pip-audit>=2.7",
  "types-PyYAML>=6.0",
]

[project.scripts]
longview = "app.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = false

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
omit = [
  "app/tests/*",
  "app/launcher.py",
  "app/cli/*",
  "app/providers/alpha_vantage_provider.py",
  "app/providers/stooq_provider.py",
  "app/providers/yfinance_provider.py",
  "app/schemas/*",
]
