name: Coverage
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e "backend[dev]"
      - run: cd backend && pytest
