name: Security
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python -m pip install --upgrade pip
      - run: pip install -e "backend[dev]"
      - run: npm --prefix frontend ci
      - run: cd backend && bandit -r app -q -x app/tests
      - run: cd backend && python -m pip_audit --skip-editable
      - run: npm --prefix frontend audit --audit-level=critical
      - run: python scripts/check_secrets.py
      - run: test -f .env.example && ! grep -E "gho_|sk-" .env.example
