name: Release
on:
  push:
    branches:
      - master
jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: make install
      - run: make ci
      - run: make build
      - run: test -f scripts/package/assets/longview-icon.png
        shell: bash
      - run: shasum -a 256 dist/* > dist/runner-checksums.txt
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: longview-markets-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
            scripts/package/assets/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
