name: Release
on:
  push:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  security-events: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: LongView-Markets-linux
            archive_ext: tar.gz
          - os: windows-latest
            platform: windows
            artifact_name: LongView-Markets-windows
            archive_ext: zip
          - os: macos-latest
            platform: macos
            artifact_name: LongView-Markets-macos
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python scripts/ci/install.py
      - run: python scripts/ci/run_checks.py
      - name: Build Windows executable
        if: matrix.platform == 'windows'
        run: python scripts/ci/run_venv.py scripts/release/build_release.py --platform windows --with-pyinstaller
      - name: Build platform package
        if: matrix.platform != 'windows'
        run: python scripts/ci/run_venv.py scripts/release/build_release.py --platform ${{ matrix.platform }}
      - name: Validate release artifacts
        run: python scripts/release/check_release_artifacts.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
            dist/checksums.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
