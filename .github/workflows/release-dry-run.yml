name: Release Dry Run
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  dry-run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python scripts/ci/install.py
      - run: python scripts/ci/run_checks.py
      - name: Build Windows executable
        if: matrix.platform == 'windows'
        run: python scripts/ci/run_venv.py scripts/release/build_release.py --platform windows --with-pyinstaller
      - name: Build platform package
        if: matrix.platform != 'windows'
        run: python scripts/ci/run_venv.py scripts/release/build_release.py --platform ${{ matrix.platform }}
      - run: python scripts/release/check_release_artifacts.py --platform ${{ matrix.platform }}
